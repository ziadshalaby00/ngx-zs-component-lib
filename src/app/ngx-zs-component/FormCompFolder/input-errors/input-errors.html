<!-- ========================= Error Messages ========================= -->
@if (extractedErrors().length) {
    <ul
        [id]="Id() + '-error'"
        class="mt-1 text-xs text-red-500 flex flex-col gap-1"
        role="status"
        aria-live="polite"
    >
        @for (err of extractedErrors(); track $index) {
            <li class="flex items-center gap-2">
                <i class="fa fa-circle text-[6px]" aria-hidden="true"></i>
                <span>{{ err }}</span>
            </li>
        }
    </ul>
}
