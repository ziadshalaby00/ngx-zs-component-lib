<div tabindex="0" 
  class="inline-flex items-center justify-center gap-2 rounded-full text-sm font-medium
  px-3 h-8 w-fit cursor-pointer"
  [ngClass]="[
    isOnline() 
      ? 'bg-green-100 text-green-800 dark:bg-green-700 dark:text-green-100'
      : 'bg-red-100 text-red-800 dark:bg-red-700 dark:text-red-100'
  ]"
>
  <i
    class="fa fa-circle text-xs leading-none"
    [ngClass]="[
      isOnline() ? 'text-green-500' : 'text-red-500'
    ]"
    aria-hidden="true"
  ></i>
  <span>
    @if (isOnline()) {
      Online
    } @else {
      Offline
    }
  </span>
</div>
