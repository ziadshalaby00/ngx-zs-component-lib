<div class="zs:h-screen zs:flex zs:items-center zs:justify-center">
    <ZS-navbar
      [siteNameConfig]="siteNameConfig"
    
      [authButtons]="authButtons"
      [showUserSection]="true"
    
      [showSearchBar]="true"
      [searchPlaceholder]="'Search for a product...'"
      [navItems]="navItems"
    
      [isLoggedIn]="true"
      [userProfile]="userProfile()"
      [userMenuItems]="userMenuItems"

      (loginClickedEv)="onLogin()"
      (signupClickedEv)="onSignup()"
      (searchSubmittedEv)="onSearch($event)"
      (searchValueChange)="onSearch($event)"
    ></ZS-navbar>

    <div class="zs:w-[360px]">

    </div>
</div>
