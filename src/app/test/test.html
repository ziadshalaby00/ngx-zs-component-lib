<div class="min-h-screen">
    <ZS-navbar
      [siteNameConfig]="siteNameConfig"
    
      [authButtons]="authButtons"
      [showUserSection]="true"
    
      [showSearchBar]="true"
      [searchPlaceholder]="'Search for a product...'"
      [navItems]="navItems"
    
      [isLoggedIn]="true"
      [userProfile]="userProfile()"
      [userMenuItems]="userMenuItems"
    
      (loginClickedEv)="onLogin()"
      (signupClickedEv)="onSignup()"
      (searchSubmittedEv)="onSearch($event)"
      (searchValueChange)="onSearch($event)"
    ></ZS-navbar>


    <div class="zs:m-auto zs:w-56 zs:flex zs:flex-col zs:gap-4 zs:my-8">
      @for(item of features; track $index; let i = $index) {
        <ZS-card
        [animation]="getAnimation(i)"
        cardStyle="info"
        bodyClass="bg-gray-100/50 dark:bg-gray-800/40 
                   hover:bg-gray-100 dark:hover:bg-gray-800 
                   transition-colors duration-300 rounded-2xl shadow-sm hover:shadow-md"
        >
        <p class="zs:p-4 zs:text-center">
          {{ item.feature }}
          <i class="{{ item.icon }}"></i>
        </p>
        </ZS-card>
      }
    </div>
</div>
