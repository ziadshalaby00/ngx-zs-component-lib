<ZS-navbar
    [siteNameConfig]="siteNameConfig"
    [mobileMode]="'sm'"

    [authButtons]="authButtons"
    [showUserSection]="true"

    [showSearchBar]="true"
    [searchPlaceholder]="'Search for a product...'"
    [navItems]="navItems()"

    [isLoggedIn]="true"
    [userProfile]="userProfile()"
    [userMenuItems]="userMenuItems()"

    (loginClickedEv)="onLogin()"
    (signupClickedEv)="onSignup()"
    (searchSubmittedEv)="onSearch($event)"
    (searchValueChange)="onSearch($event)"
></ZS-navbar>


<div class="zs:flex">
    <ZS-sidebar
    header="Chats"
    [openSide]="true"
    [preventClose]="false"
    class='zs:h-[85vh]'
    >
        <div main class="zs:flex zs:flex-col zs:h-full 
        zs:gap-4 zs:pt-4 zs:pb-5 zs:pl-1.5 zs:pr-3">
            <div class="zs:px-3">
                <ZS-input
                placeholder="Search for chat..."
                type="search"
                inputStyle="primary"
                [showLoaderIconOnSearchInput]="true"
                >
                </ZS-input>
            </div>
            <div class='zs:flex zs:flex-col zs:gap-4 zs:h-full 
            zs:pt-2 zs:pb-6 zs:px-3 scroll scroll-success'>
                @for(item of items; track $index; let i = $index) {
                    <ZS-card
                        (click)="cardClicked('Card Clicked')"
                        [clickable]="true"
                        cardStyle="success"
                        [style]="'z-index: ' + (items.length-i)"
                    >
                        <div class="zs:py-3.5 zs:px-4.5 zs:flex zs:justify-between zs:items-center">
                            <!-- Left content -->
                            <div class="zs:flex zs:items-center zs:gap-3">
                                <div
                                class="zs:size-14 zs:min-w-14 zs:text-2xl zs:rounded-full 
                                zs:shadow-lg zs:bg-blue-500
                                zs:flex zs:items-center zs:justify-center 
                                zs:text-white zs:font-semibold zs:ring-1"
                                >
                                Z
                                </div>

                                <div class="zs:flex zs:flex-col zs:gap-1.5">
                                    <p class="zs:font-semibold zs:leading-none zs:line-clamp-1">
                                        Ziad Shalaby
                                    </p>
                                <p class="zs:text-xs zs:text-gray-600 zs:dark:text-gray-400 
                                zs:leading-none zs:line-clamp-1">
                                    1111111111111111111111111
                                </p>
                                </div>
                            </div>
                            <div 
                            (click)="$event.stopPropagation()"
                            (mousedown)="$event.preventDefault()"
                            class="zs:absolute zs:top-1/2 zs:-translate-y-1/2 zs:right-0">
                                <!-- Settings icon -->
                                <ZS-nav-item
                                    [collectionName]="'chat-settings'"
                                    [item]="chatSettings()"
                                >
                                </ZS-nav-item>
                            </div>
                        </div>
                    </ZS-card>
                }
            </div>
        </div>
    </ZS-sidebar>
</div>

<!-- Chat Settings Icon -->
<ng-template #chatSettingsIcon>
    <div class="zs:flex zs:items-center zs:p-2 zs:justify-center">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
</ng-template>
