<!-- ========================= Page 404 Container ========================= -->
<div class="zs:flex zs:flex-col zs:items-center zs:justify-center zs:min-h-[90vh]
    zs:text-center zs:animate-fadeIn"
    [ngClass]="[style().iconText]"
    >

  <!-- ========================= Icon ========================= --> 
  <div class="zs:text-[136px] zs:mb-8 animate-float zs:opacity-90 zs:leading-none">
    <ng-template #defaultIcon>
      <i class="fas fa-ghost"></i>
    </ng-template>
    <ng-container *ngTemplateOutlet="iconTpl() ?? defaultIcon"></ng-container>
  </div>

  <!-- ========================= Title ========================= -->
  <h1 class="zs:text-6xl zs:font-black zs:tracking-widest zs:mb-2 
  zs:text-rose-600 zs:dark:text-rose-500 zs:select-none
  zs:drop-shadow-[0_0_8px_rgba(239,68,68,0.5)]">
    404
  </h1>


  <!-- ========================= Message ========================= -->
  <h2 class="zs:text-2xl zs:text-rose-600/80 zs:dark:text-rose-800/80 zs:font-semibold zs:mb-4">
    {{ title() }}
  </h2>
  <p class="zs:text-base zs:max-w-md zs:text-gray-600 zs:dark:text-gray-400 zs:mb-8">
    {{ message() }}
  </p>

  <!-- ========================= Button ========================= -->
  @if (showButton()) {
    <a
      [routerLink]="routerLink()"
      (click)="onAction.emit()"
      class="zs:px-6 zs:py-2 zs:rounded-full
             zs:text-white zs:font-medium zs:shadow-md
             zs:hover:shadow-lg zs:flex zs:items-center 
             zs:justify-center
             zs:gap-1.5"
      [ngClass]="[style().btnBG, style().btnBGHover]"
    >
      <i class="fa-solid fa-house"></i>
      {{ buttonText() }}
    </a>
  }
</div>
