<!-- ========================= Loader Wrapper ========================= -->
@if(loading()) {
  <div 
    [ngClass]="[wrapperClasses()]" 
    role="status" 
    aria-live="polite" 
    aria-busy="true"
  >
    <div [ngClass]="[boxClasses()]">
  
      @switch (type()) {
  
        <!-- ========================= Spinner ========================= -->
        @case ('spinner') {
          <i 
            [ngClass]="['fas fa-spinner fa-spin', spinnerSizeTextClass(), textColor()]" 
            aria-hidden="true"
          ></i>
          <span class="sr-only">Loading...</span>
        }
  
        <!-- ========================= Pro Spinner ========================= -->
        @case ('pro') {
          <div 
            [ngClass]="['zs:animate-spin zs:rounded-full zs:border-solid', spinnerSizeProClass(), borderColor()]" 
            aria-hidden="true"
          ></div>
          <span class="sr-only">Loading...</span>
        }
  
        <!-- ========================= Gear ========================= -->
        @case ('gear') {
          <i 
            [ngClass]="['fas fa-gear fa-spin', spinnerSizeTextClass(), textColor()]" 
            aria-hidden="true"
          ></i>
          <span class="sr-only">Loading...</span>
        }
  
        <!-- ========================= Fan ========================= -->
        @case ('fan') {
          <i 
            [ngClass]="['fas fa-fan fa-spin', spinnerSizeTextClass(), textColor()]" 
            aria-hidden="true"
          ></i>
          <span class="sr-only">Loading...</span>
        }
  
        <!-- ========================= Pulse ========================= -->
        @case ('pulse') {
          <div 
            [ngClass]="[
              'zs:animate-spin zs:rounded-full zs:border-solid',
              spinnerSizePulseClass(),
              borderColor(),
              'zs:border-t-transparent!'
            ]" 
            aria-hidden="true"
          ></div>
          <span class="sr-only">Loading...</span>
        }
  
        <!-- ========================= Dots ========================= -->
        @case ('dots') {
          <div class="zs:flex zs:gap-2 zs:items-center" aria-hidden="true">
            <span 
              class="zs:rounded-full zs:animate-bounce" 
              [ngClass]="[bgColor(), spinnerSizeDotsClass()]" 
              style="animation-delay: 0s"
            ></span>
            <span 
              class="zs:rounded-full zs:animate-bounce" 
              [ngClass]="[bgColor(), spinnerSizeDotsClass()]" 
              style="animation-delay: 0.2s"
            ></span>
            <span 
              class="zs:rounded-full zs:animate-bounce" 
              [ngClass]="[bgColor(), spinnerSizeDotsClass()]" 
              style="animation-delay: 0.4s"
            ></span>
          </div>
          <span class="sr-only">Loading...</span>
        }
  
        <!-- ========================= Bars ========================= -->
        @case ('bars') {
          <div class="zs:flex zs:gap-1 zs:items-center zs:h-6" aria-hidden="true">
            <span 
              class="zs:rounded-sm animate-bar-scale" 
              [ngClass]="[bgColor(), spinnerSizeBarsClass(1)]" 
              style="animation-delay: 0s"
            ></span>
            <span 
              class="zs:rounded-sm animate-bar-scale" 
              [ngClass]="[bgColor(), spinnerSizeBarsClass(2)]" 
              style="animation-delay: 0.2s"
            ></span>
            <span 
              class="zs:rounded-sm animate-bar-scale" 
              [ngClass]="[bgColor(), spinnerSizeBarsClass(3)]" 
              style="animation-delay: 0.4s"
            ></span>
          </div>
          <span class="sr-only">Loading...</span>
        }
  
        <!-- ========================= Double Spinner ========================= -->
        @case ('double') {
          <div class="zs:relative" aria-hidden="true">
            <!-- Outer ring -->
            <div 
              [ngClass]="[
                'zs:animate-spin zs:rounded-full zs:border-solid',
                spinnerSizeDoubleClass(1),
                borderColor(), 
                'zs:border-t-transparent!'
              ]"
            ></div>
            <!-- Inner ring (reversed animation) -->
            <div 
              [ngClass]="[
                'zs:animate-spin zs:opacity-75 zs:rounded-full zs:border-solid zs:absolute 
                zs:top-1/2 zs:left-1/2 zs:-translate-x-1/2 zs:-translate-y-1/2',
                spinnerSizeDoubleClass(2),
                borderColor(), 
                'zs:border-b-transparent!'
              ]"
              style="animation-direction: reverse;"
            ></div>
          </div>
          <span class="sr-only">Loading...</span>
        }
      }
    </div>
  </div>
}
