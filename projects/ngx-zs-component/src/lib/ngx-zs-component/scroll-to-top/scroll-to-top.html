<!-- ========================= Scroll-to-Top Container ========================= -->
<div
  [ngClass]="positionClass()"
  class="zs:fixed zs:group zs:bottom-4 {{ zIndices.scrollToTop }} 
  zs:transition-opacity zs:duration-300"
  [style.opacity]="scrollY() > 200 ? 1 : 0"
>
  <!-- ========================= Scroll Button ========================= -->
  <button
    (click)="scrollToTop()"
    class="zs:w-12 zs:h-12 zs:group-hover:scale-105 zs:rounded-full zs:flex zs:items-center 
    zs:justify-center zs:relative zs:overflow-hidden zs:focus:outline-hidden"
    type="button"
    role="button"
    aria-label="Scroll to top"
    title="Scroll to top"
  >
    <!-- ========================= Progress Ring (SVG) ========================= -->
    <svg
      class="zs:absolute zs:inset-0 zs:w-full zs:h-full zs:transform zs:-rotate-90"
      aria-hidden="true"
      focusable="false"
    >
      <!-- Background Circle -->
      <circle
        cx="24"
        cy="24"
        r="22"
        stroke="transparent"
        stroke-width="5"
        fill="currentColor"
        [ngClass]="circleColorClass()"
      />

      <!-- Animated Progress Circle -->
      <circle
        cx="24"
        cy="24"
        r="22"
        stroke="currentColor"
        stroke-width="5"
        fill="transparent"
        [attr.stroke-dasharray]="circleCircumference"
        [attr.stroke-dashoffset]="progressOffset()"
        [ngClass]="arrowProgressColorClass()"
        class="zs:transition-[stroke-dashoffset] zs:duration-300 zs:ease-out"
        stroke-linecap="round"
      />
    </svg>

    <!-- ========================= Up Arrow Icon ========================= -->
    <i
      class="fas fa-arrow-up zs:relative zs:z-100 zs:text-lg"
      [ngClass]="arrowProgressColorClass()"
      aria-hidden="true"
    ></i>
  </button>
</div>
