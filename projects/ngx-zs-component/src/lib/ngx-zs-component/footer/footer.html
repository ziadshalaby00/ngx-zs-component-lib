<footer class="zs:bg-gray-700 zs:dark:bg-gray-950 
zs:dark:text-gray-300 zs:text-white zs:py-6">
    <div class="zs:text-center zs:flex zs:flex-col zs:gap-8">
        <p class="zs:text-xs zs:sm:text-sm zs:px-6">
            <ng-content select="[rights]"></ng-content>

            @if(showDefultContent()) {
                &copy;
                <span class="zs:font-semibold">2026 Ziad Ahmed Shalaby</span>.
                All rights reserved.
            }
        </p>

        @if(pages().length) {
            <nav class="zs:flex zs:flex-wrap zs:justify-center zs:items-center
            zs:gap-y-6 zs:gap-x-4 zs:sm:gap-x-6 zs:md:gap-x-8 zs:lg:gap-x-10 zs:w-full">
                @for (page of pages(); track $index) {
                    <a class="zs:text-[10px] zs:sm:text-xs 
                    zs:hover:underline zs:text-center zs:min-w-30" 
                    [routerLink]="page.routerLink">
                        {{ page.label }}
                    </a>
                }
            </nav>
        }
    </div>
</footer>
