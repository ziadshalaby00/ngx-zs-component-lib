<div class="zs:flex zs:items-center zs:justify-start zs:w-full zs:select-none">
  <!-- ===================== Checkbox Wrapper ===================== -->
  <div
    class="zs:cursor-pointer group leading-none"
  >
    <!-- ===================== Hidden Input (Native for screen readers) ===================== -->
    <input
      type="checkbox"
      class="zs:hidden"
      [id]="Id()"
      [checked]="isChecked()"
      [disabled]="disabledOrReadonly()"
      (change)="toggleChecked()"
    />

    <!-- ===================== Custom Accessible Checkbox ===================== -->
    <span
      role="'checkbox'"
      tabindex="0"
      [attr.aria-checked]="isChecked()"
      [attr.aria-disabled]="disabledOrReadonly()"
      [attr.aria-labelledby]="Id() + '-label'"
      [ngClass]="[
        sizeClass(),
        palette().checkBoxText,
        palette().checkBoxTextHover,
        palette().ring,
        'zs:leading-none zs:inline-flex zs:items-center zs:justify-center zs:focus:outline-hidden zs:focus-visible:ring-2'
      ]"
      (click)="toggleChecked()"
      (keydown)="onKeyDown($event)"
    >
      <i [class]="iconClasses()"></i>
    </span>
  </div>

  <!-- ===================== Label (ZS-label component) ===================== -->
  <ZS-label [class]="(label() || hint()) ? 'zs:ml-1' : ''"
    [id]="Id() + '-label'"
    [label]="label()"
    [hint]="hint()"
    [hintId]="Id() + '-hint'"
    [size]="size()"
    [for]="Id()"
  ></ZS-label>
</div>
