<!-- ================= Label Wrapper ================= -->
@if (label() || hint()) {
  <label 
    [for]="for()" 
    class="zs:flex zs:items-center zs:flex-wrap"
  >
  <!-- ========== Label Text ========== -->
    @if (label()) {
      <span class="zs:font-semibold" 
      [ngClass]="[
        sizeClasses().label,
        hint() ? 'zs:mr-1.5' : ''
      ]">
        {{ label() }}

        <!-- Required Indicator -->
        @if (true) {
          <span class="zs:text-red-500 zs:ml-1" aria-hidden="true">*</span>
          <span class="sr-only">(required)</span>
        }
      </span>
    }

    <!-- ========== Hint Text ========== -->
    @if (hint()) {
      <small
        [id]="hintId()"
        class="zs:text-slate-500 zs:dark:text-slate-400 zs:transition-colors" 
        [ngClass]="sizeClasses().hint"
      >
        {{ hint() }}
      </small>
    }
    <!-- ========== End Hint Text ========== -->
  </label>
}
<!-- ================= End Label Wrapper ================= -->
