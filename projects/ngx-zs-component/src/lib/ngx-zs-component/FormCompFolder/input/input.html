<!-- ==============================================
     Input Field Component (ZS-Input)
     ============================================== -->

<div class="zs:w-full">

  <!-- ========================= Label & Hint ========================= -->
  <ZS-label [class]="(label() || hint()) ? 'zs:mb-1' : ''"
    [label]="label()"
    [hint]="hint()"
    [required]="required()"
    [hintId]="Id() + '-hint'"
    [size]="size()"
    [for]="Id()"
  >
  </ZS-label>

  <!-- ========================= Input Container ========================= -->
  <div
    class="zs:relative zs:flex zs:items-center zs:w-full"
    [class]="containerClasses() + ' ' + getSize('container')"
    (click)="focusInput($event)"
  >

    <!-- ========================= Left Icon ========================= -->
    @if(loaderIconOnSearchInput()) {
      <i
        [ngClass]="[loaderIconOnSearchInput(), getSize('leftIcon')]"
        aria-hidden="true"
      ></i>
    }@else if(iconTpl()) {
      <ng-container *ngTemplateOutlet="iconTpl()"></ng-container>
    }@else if(isDate()) {
      <i
        [ngClass]="[dateIcon(), getSize('leftIcon')]"
        aria-hidden="true"
      ></i>
    }

    <!-- ========================= Input Field ========================= -->
    <input
      #inputEl
      [id]="Id()"
      [name]="iName()"
      [type]="actualType"
      (keydown)="onKeydown($event)"
      [attr.placeholder]="placeholder()"
      [value]="value()"
      [disabled]="disabled() ? true : null"
      [attr.min]="supportsMinMaxStep() ? htmlMin() : null"
      [attr.max]="supportsMinMaxStep() ? htmlMax() : null"
      [attr.step]="supportsMinMaxStep() ? step() : null"
      [attr.required]="required() ? true : null"
      (input)="onInput($event)"
      (keydown.enter)="onEnter()"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (change)="onChange()"
      [attr.autocomplete]="autocomplete()"
      [attr.maxlength]="effectiveMaxLength()"
      [attr.minlength]="effectiveMinLength()"
      [attr.autofocus]="autofocus() ? true : null"
      [attr.readonly]="readonly() ? true : null"
      [attr.aria-invalid]="invalid()"
      [attr.inputmode]="inputmode()"
      [spellcheck]="spellcheck()"
      class="zs:flex-1 zs:bg-transparent zs:outline-hidden zs:caret-current zs:w-full"
      [class]="getSize('field')"
      [attr.aria-describedby]="
        (hint() ? Id() + '-hint' : '') +
        (hint() && invalid() ? ' ' : '') +
        (invalid() ? Id() + '-error' : '')
      "
    />

    <!-- ========================= Spacer (Maintains Height) ========================= -->
    <div class="zs:h-6"></div>

    <!-- ========================= Password Toggle ========================= -->
    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePassword()"
        [attr.aria-pressed]="showPassword()"
        class="zs:ml-1 zs:px-1 zs:text-slate-500 zs:hover:text-slate-700 
        zs:dark:text-slate-400 zs:dark:hover:text-slate-200"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      >
        <i
          class="fa"
          [class]="(showPassword() ? 'fa-eye-slash' : 'fa-eye') + ' ' + getSize('rightIcon')"
          aria-hidden="true"
        ></i>
      </button>
    }

    <!-- ========================= Clear Button ========================= -->
    @if (showClear() && !disabledOrReadonly()) {
      <button
        type="button"
        (click)="clear()"
        class="zs:ml-1 zs:px-1 zs:text-slate-500 zs:hover:text-slate-700 
        zs:dark:text-slate-400 zs:dark:hover:text-slate-200"
        [attr.aria-label]="'Clear ' + (label() || 'input')"
      >
        <i
          class="fa fa-times"
          [class]="getSize('rightIcon')"
          aria-hidden="true"
        ></i>
      </button>
    }

    <!-- ========================= Search Icon ========================= -->
    @if (type() === 'search' || showSearchIcon()) {
      <button
        type="button"
        (click)="onSearch()"
        class="zs:ml-1 zs:px-1 zs:text-slate-500 zs:hover:text-slate-700 
        zs:dark:text-slate-400 zs:dark:hover:text-slate-200"
        aria-label="Search"
      >
        <i
          class="fa fa-search"
          [class]="getSize('rightIcon')"
          aria-hidden="true"
        ></i>
      </button>
    }

  </div>

  <!-- ========================= Error Messages ========================= -->
  <ZS-input-errors
  [Id]="Id()"
  [errors]="[errorsUI()]"
  >
  </ZS-input-errors>

</div>
