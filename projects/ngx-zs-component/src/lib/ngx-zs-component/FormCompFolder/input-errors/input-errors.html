<!-- ========================= Error Messages ========================= -->
@if (extractedErrors().length) {
    <ul
        [id]="Id() + '-error'"
        class="zs:mt-1 zs:text-xs zs:text-red-500 zs:flex zs:flex-col zs:gap-1"
        role="status"
        aria-live="polite"
    >
        @for (err of extractedErrors(); track $index) {
            <li class="zs:flex zs:items-center zs:gap-2">
                <i class="fa fa-circle zs:text-[6px]" aria-hidden="true"></i>
                <span>{{ err }}</span>
            </li>
        }
    </ul>
}
