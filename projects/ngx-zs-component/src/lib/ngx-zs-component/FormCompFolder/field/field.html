<!-- ==============================================
     Headless Field Shell (ZS-Field)
     يُستخدم مع أي <input>/<textarea>/<select> عادي بره
     ============================================== -->

<div class="zs:w-full">

  <!-- ========================= Label & Hint ========================= -->
  <ZS-label [class]="(label() || hint()) ? 'zs:mb-1' : ''"
    [label]="label()"
    [hint]="hint()"
    [required]="required()"
    [hintId]="Id() + '-hint'"
    [size]="size()"
    [for]="for()"
  ></ZS-label>

  <!-- ========================= Field Container ========================= -->
  <div
    class="zs:relative zs:flex zs:items-center zs:w-full"
    [class]="containerClasses() + ' ' + getSize('container')"
  >
    <!-- ========================= Left Icon ========================= -->
    @if (iconTpl()) {
      <ng-container *ngTemplateOutlet="iconTpl()"></ng-container>
    }

    <!-- ========================= المحتوى المُسقَط (input/textarea/select المستخدم) ========================= -->
    <ng-content></ng-content>

    <!-- ========================= Spacer (ثبات الارتفاع) ========================= -->
    <div class="zs:h-6"></div>

    <!-- ========================= Suffix (clear/password-toggle/search... اختياري) ========================= -->
    <ng-content select="[fieldSuffix]"></ng-content>
  </div>

  <!-- ========================= Error Messages ========================= -->
  <ZS-input-errors
    [Id]="Id()"
    [errors]="[errors()]"
  ></ZS-input-errors>

</div>
