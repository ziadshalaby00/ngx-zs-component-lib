<!-- ========================= Label ========================= -->
<div class="zs:flex zs:flex-col zs:w-full zs:select-none">
  <ZS-label [class]="(label() || hint()) ? 'zs:mb-1' : ''"
  [label]="label()"
  [hint]="hint()"
  [hintId]="Id() + '-hint'"
  [size]="size()"
  [for]="Id()"
  ></ZS-label>

  <!-- ========================= Slider Container ========================= -->
  <div class="zs:flex zs:items-center"
  [class]="gapCLasses()">
    
    <!-- ========================= Track ========================= -->
    <div
      #track
      [class]="rangeClasses()"
      (mousedown)="onMouseDown($event)"
    >
      
      <!-- ========================= Track Background ========================= -->
      <div
        class="zs:absolute zs:inset-0 zs:rounded-full 
        zs:bg-linear-to-r zs:from-gray-200 zs:to-gray-300 
        zs:transition-[filter,background-image] zs:duration-300 zs:ease-out
        motion-reduce:zs:transition-none zs:group-hover:brightness-110"
        [ngClass]="[
          ['secondary', 'dark'].includes(inputStyle()) ? 'zs:dark:from-gray-500 zs:dark:to-gray-600' : 'zs:dark:from-gray-700 zs:dark:to-gray-800',
          disabledOrReadonly() ? 'zs:cursor-not-allowed' : ''
        ]"
        ></div>

      <!-- ========================= Fill (Progress) ========================= -->
      <div
        class="zs:absolute zs:left-0 zs:rounded-full zs:top-0 zs:h-full 
          zs:transition-[width,background-color,box-shadow]
          zs:duration-200 zs:ease-out zs:shadow-sm motion-reduce:zs:transition-none"
        [style.width.%]="percent()"
        [ngClass]="[
          disabledOrReadonly() ? 'zs:cursor-not-allowed' : '',
          palette().buttonSolidPalette.btnBG,
          palette().buttonSolidPalette.btnBGHover
        ]"
      ></div>

      <!-- ========================= Thumb (Handle) ========================= -->
      <div
        class="zs:absolute zs:top-1/2 zs:rounded-full zs:flex zs:items-center zs:justify-center 
        zs:-translate-y-1/2 zs:transition-[transform,box-shadow,background-color] 
        zs:duration-200 zs:ease-out zs:shadow-md 
        zs:group-hover:scale-110"
        [style.left]="calcThumbPosition()"
        [ngClass]="[ThumbClasses(), disabledOrReadonly() ? 'zs:cursor-not-allowed' : '']"
        role="slider"
        tabindex="0"
        [attr.id]="Id()"
        [attr.aria-valuemin]="min()"
        [attr.aria-valuemax]="max()"
        [attr.aria-valuenow]="value()"
        [attr.aria-disabled]="disabledOrReadonly() || null"
        [attr.aria-readonly]="isReadonly() || null"
        [attr.aria-labelledby]="Id() + '-label'"
        [attr.aria-describedby]="hint() ? Id() + '-hint' : null"
        aria-orientation="horizontal"
      >
        <i class="fa-solid fa-circle zs:text-white" [ngClass]="dotCLasses()"></i>
      </div>
    </div>

    <!-- ========================= Value Display ========================= -->
    @if (showValue()) {
      <div class="zs:text-sm zs:text-gray-600 zs:dark:text-gray-300 zs:font-medium">
        {{ value() }}
      </div>
    }
  </div>
</div>
