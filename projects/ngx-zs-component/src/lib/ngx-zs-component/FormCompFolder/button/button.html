<!-- ========================= Button Core Attributes ========================= -->
<button 
  [id]="Id()"
  class="zs:w-full"
  [attr.type]="type()"
  [disabled]="disabled()"
  [ngClass]="['zs:flex zs:gap-2', baseClasses()]"

  [attr.aria-disabled]="disabled()"
  [attr.aria-label]="iconTpl() ? (iconTpl() + ' button') : undefined"
  [attr.tabindex]="disabled() ? -1 : 0"

  (click)="onClick($event)"
>
  <!-- ========================= Button Content ========================= -->
  <ng-container *ngTemplateOutlet="iconTpl()"></ng-container>
  <ng-content></ng-content>
</button>
